<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>设计师面谈评分卡</title>
<style>
:root{
  --primary:#2563eb; --primary-dark:#1e40af; --primary-light:#dbeafe;
  --bg:#eef2f7; --card:#ffffff; --line:#e2e8f0;
  --text:#1e293b; --muted:#64748b;
  --star:#f59e0b; --star-bg:#d5dbe3;
  --good:#16a34a; --mid:#d97706; --bad:#dc2626;
  --radius:14px; --shadow:0 1px 4px rgba(15,23,42,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;padding-bottom:96px}
button{font-family:inherit;border:none;background:none;cursor:pointer;font-size:15px}
textarea,input{font-family:inherit}

/* 顶部 */
.header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#2563eb,#1e40af);color:#fff;padding:12px 14px 10px;box-shadow:0 2px 10px rgba(30,64,175,.3)}
.h-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.h-title{font-size:17px;font-weight:700;letter-spacing:.5px}
.h-sub{font-size:11px;opacity:.85;margin-top:2px}
.view-switch{display:flex;background:rgba(255,255,255,.18);border-radius:10px;padding:3px;flex-shrink:0}
.view-switch button{color:#fff;padding:6px 10px;border-radius:8px;font-size:12.5px;font-weight:600;transition:all .15s;white-space:nowrap}
.view-switch button.active{background:#fff;color:var(--primary-dark)}

/* 云状态条 */
.cloud-strip{display:flex;align-items:center;gap:6px;font-size:11.5px;padding:5px 10px;border-radius:8px;margin-top:8px;background:rgba(255,255,255,.14);color:#e2e8f0}
.cloud-strip .dot{width:8px;height:8px;border-radius:50%;background:#94a3b8;flex-shrink:0}
.cloud-strip.st-ok{background:rgba(22,163,74,.35);color:#dcfce7}
.cloud-strip.st-ok .dot{background:#4ade80}
.cloud-strip.st-err{background:rgba(220,38,38,.4);color:#fee2e2}
.cloud-strip.st-err .dot{background:#f87171}
.cloud-strip.st-sync .dot{background:#fbbf24;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.cloud-strip button{color:#fff;font-size:11px;font-weight:700;text-decoration:underline;margin-left:auto;flex-shrink:0}

/* 设计师标签 */
.designer-bar{display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-top:2px}
.designer-bar::-webkit-scrollbar{display:none}
.d-tab{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);color:#fff;padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0}
.d-tab.active{background:#fff;color:var(--primary-dark);border-color:#fff}
.d-tab .del{opacity:.55;font-size:15px;padding:0 2px;line-height:1}
.d-tab .del:hover{opacity:1}
.d-add{background:rgba(255,255,255,.16);border:1px dashed rgba(255,255,255,.5);color:#fff;padding:6px 13px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0}

/* 主体 */
main{max-width:860px;margin:0 auto;padding:14px 12px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-title{font-size:16px;font-weight:700;color:var(--primary-dark)}
.part-sum{font-size:13px;font-weight:700;color:var(--primary);background:var(--primary-light);padding:3px 10px;border-radius:12px}

/* 使用说明 */
.hint-box{background:#f0f7ff;border:1px solid #bfdbfe;border-radius:10px;padding:12px 14px;font-size:13px;color:#1e40af;margin-bottom:12px}
.hint-box b{display:block;margin-bottom:4px;font-size:13px}
.hint-box ul{padding-left:18px}
.hint-box li{margin:3px 0}
.collapsed .hint-detail{display:none}
.hint-toggle{color:var(--primary);font-size:12px;font-weight:700;cursor:pointer;user-select:none}

/* 题目 */
.q-item{border-bottom:1px solid var(--line);padding:13px 2px}
.q-item:last-child{border-bottom:none}
.q-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.q-left{flex:1;min-width:0}
.q-num{display:inline-block;background:var(--primary);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:2px}
.q-title{font-weight:600;font-size:15px;color:var(--text)}
.q-why{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.veto-tag{display:inline-block;font-size:10px;font-weight:700;color:#fff;background:var(--bad);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.stars{display:flex;gap:4px;flex-shrink:0;padding:4px 0}
.star{width:34px;height:34px;font-size:22px;line-height:34px;text-align:center;color:var(--star-bg);transition:transform .1s}
.star.on{color:var(--star)}
.star:active{transform:scale(1.25)}
.q-std-toggle{color:var(--primary);font-size:12px;font-weight:600;margin-top:6px;user-select:none;cursor:pointer}
.std-box{display:none;background:#f8fafc;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:12.5px;line-height:1.6}
.q-item.open .std-box{display:block}
.std-row{display:flex;gap:8px;margin:4px 0}
.std-tag{flex-shrink:0;font-weight:700;border-radius:5px;padding:0 6px;font-size:11px}
.t5{color:#fff;background:var(--good)}
.t3{color:#fff;background:var(--mid)}
.t1{color:#fff;background:var(--bad)}
.std-txt{color:var(--text)}

/* 开放记录 */
.rec-item{margin-bottom:14px}
.rec-item:last-child{margin-bottom:0}
.rec-label{font-weight:600;font-size:14px;margin-bottom:6px;color:var(--primary-dark)}
.rec-label .q-num{margin-right:6px}
.rec-hint{font-size:12px;color:var(--muted);margin-bottom:6px}
.rec-item textarea{width:100%;min-height:88px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;resize:vertical;background:#fafcff;color:var(--text)}
.rec-item textarea:focus{outline:none;border-color:var(--primary);background:#fff}

/* 临时卡片 */
.card-fields{padding:2px 0}
.cf-item{margin-bottom:14px}
.cf-item:last-child{margin-bottom:0}
.cf-label{font-weight:600;font-size:14px;margin-bottom:6px;color:var(--primary-dark);display:flex;align-items:center;gap:6px}
.cf-label .q-num{margin-right:0}
.cf-hint{font-size:12px;color:var(--muted);margin-bottom:6px}
.cf-item input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;background:#fafcff;color:var(--text)}
.cf-item input[type=text]:focus{outline:none;border-color:var(--primary);background:#fff}
.cf-item textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;resize:vertical;background:#fafcff;color:var(--text)}
.cf-item textarea:focus{outline:none;border-color:var(--primary);background:#fff}
.cf-memo{min-height:190px}
.card-mini{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin-bottom:14px}
.card-mini .badge{font-size:11.5px}

/* 贴纸 */
.sticker{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11.5px;font-weight:800;color:#fff;white-space:nowrap;border:1px dashed rgba(255,255,255,.65);box-shadow:1px 2px 4px rgba(15,23,42,.28);transform:rotate(-3deg);cursor:pointer;vertical-align:middle}
.sticker.big{font-size:14px;padding:5px 14px;border-radius:8px;transform:rotate(-4deg)}
.sticker.none{background:#94a3b8}
.stk-btn{display:inline-block;margin:4px;padding:7px 15px;border-radius:9px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:transform .1s}
.stk-btn:active{transform:scale(.94)}
.stk-btn.on{outline:3px solid #1e40af}
.tab-stk{display:inline-block;font-size:10px;font-weight:800;color:#fff;padding:1px 6px;border-radius:4px;margin-left:2px;vertical-align:1px;white-space:nowrap}
.ds-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;padding:12px 16px}
.ds-name{font-size:15px;font-weight:700}
.ds-contact{font-size:12.5px;color:var(--muted);font-weight:500;margin-left:4px}

/* 底部汇总栏 */
.bottom-bar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(15,23,42,.08)}
.bb-inner{max-width:860px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bb-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bb-score{font-size:14px;font-weight:700;color:var(--text)}
.bb-score b{font-size:21px;color:var(--primary)}
.badge{font-size:12.5px;font-weight:700;padding:5px 13px;border-radius:16px}
.b-rec{background:#dcfce7;color:#166534}
.b-mid{background:#dbeafe;color:#1e40af}
.b-low{background:#fef3c7;color:#92400e}
.b-out{background:#fee2e2;color:#991b1b}
.veto-strip{width:100%;background:#fee2e2;color:#991b1b;font-size:12.5px;font-weight:600;border-radius:8px;padding:6px 10px;margin-top:6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.veto-strip button{color:#b91c1c;font-size:12px;font-weight:700;text-decoration:underline}
.bb-right{display:flex;gap:8px}
.btn{background:var(--primary);color:#fff;font-weight:600;padding:9px 16px;border-radius:10px;font-size:14px;transition:opacity .15s}
.btn:active{opacity:.8}
.btn.ghost{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
.btn.gray{background:#fff;color:var(--muted);border:1.5px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
.btn.danger{background:#fff;color:var(--bad);border:1.5px solid var(--bad)}
.save-btn{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;box-shadow:0 2px 8px rgba(22,163,74,.3)}
.save-btn:active{opacity:.85}
.cloud-btn{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
.cloud-btn.st-ok{background:#dcfce7;color:#166534;border-color:#16a34a}
.cloud-btn.st-err{background:#fee2e2;color:#991b1b;border-color:#dc2626}
.cloud-btn.st-sync{background:#fef9c3;color:#854d0e;border-color:#eab308}

/* 对比表 */
.cmp-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1px solid var(--line)}
.cmp-table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
.cmp-table th,.cmp-table td{border:1px solid var(--line);padding:8px 10px;text-align:center;white-space:nowrap}
.cmp-table th{background:#f1f5f9;font-weight:700;color:var(--text);position:sticky;top:0}
.cmp-table td:first-child,.cmp-table th:first-child{text-align:left;position:sticky;left:0;background:#f8fafc;min-width:150px;z-index:2;font-weight:600}
.cmp-table tr.sumrow td{background:var(--primary-light);font-weight:700;font-size:14px}
.cmp-table tr.sumrow td:first-child{background:#dbeafe;color:var(--primary-dark)}
.sc-5{color:var(--good);font-weight:700}
.sc-3{color:var(--mid);font-weight:700}
.sc-1{color:var(--bad);font-weight:700}
.sc-0{color:#cbd5e1}
.veto-cell{color:var(--bad);font-weight:700}

/* 弹窗 */
.modal-mask{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:100;align-items:center;justify-content:center;padding:18px}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:420px;padding:20px;box-shadow:0 10px 40px rgba(15,23,42,.25);max-height:86vh;overflow-y:auto}
.modal h3{font-size:16px;color:var(--primary-dark);margin-bottom:14px}
.modal label{display:block;font-size:13px;font-weight:600;margin:10px 0 5px;color:var(--text)}
.modal input[type=text],.modal textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;background:#fafcff;color:var(--text)}
.modal input:focus,.modal textarea:focus{outline:none;border-color:var(--primary)}
.modal textarea{min-height:110px;font-size:12px;font-family:Consolas,monospace;resize:vertical}
.modal-btns{display:flex;gap:10px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.modal-tip{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:rgba(15,23,42,.85);color:#fff;font-size:13px;padding:9px 18px;border-radius:20px;z-index:300;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}

@media (max-width:420px){
  .q-head{flex-direction:column}
  .stars{width:100%;justify-content:space-between;padding:6px 2px}
  .star{width:44px;height:40px;font-size:26px;line-height:40px}
  .h-title{font-size:16px}
}
@media (min-width:761px){
  .star{width:30px;height:30px;font-size:20px;line-height:30px}
}
</style>
</head>
<body>

<div class="header">
  <div class="h-top">
    <div>
      <div class="h-title">📐 设计师面谈评分卡</div>
      <div class="h-sub">18题打分 · 临时卡片 · 云实时同步</div>
    </div>
    <div class="view-switch">
      <button id="tab-score" class="active" onclick="switchView('score')">评分</button>
      <button id="tab-card" onclick="switchView('card')">卡片</button>
      <button id="tab-compare" onclick="switchView('compare')">对比</button>
    </div>
  </div>
  <div class="cloud-strip" id="cloudStrip"><span class="dot"></span><span id="cloudTxt">正在连接云端…</span><button id="cloudCfgBtn" onclick="openCloud()" style="display:none">设置</button></div>
  <div class="designer-bar" id="designerBar"></div>
</div>

<main id="main"></main>

<div class="bottom-bar" id="bottomBar" style="display:none">
  <div class="bb-inner" id="bbInner"></div>
</div>

<!-- 添加/编辑设计师 -->
<div class="modal-mask" id="mAdd" onclick="if(event.target===this)closeModal('mAdd')">
  <div class="modal">
    <h3 id="mAddTitle">添加候选设计师</h3>
    <label>名称 *</label>
    <input type="text" id="iName" placeholder="如：栖斯设计 / 张三（独立设计师）" maxlength="24">
    <label>联系方式（可选）</label>
    <input type="text" id="iContact" placeholder="微信 / 电话 / 来源" maxlength="60">
    <div class="modal-btns">
      <button class="btn gray" onclick="closeModal('mAdd')">取消</button>
      <button class="btn" onclick="saveDesigner()">保存</button>
    </div>
  </div>
</div>

<!-- 贴纸选择 -->
<div class="modal-mask" id="mSticker" onclick="if(event.target===this)closeModal('mSticker')">
  <div class="modal">
    <h3 id="stkTitle">🏷️ 设置贴纸</h3>
    <label>点选预设状态</label>
    <div id="stkPresets"></div>
    <label>或自定义文字</label>
    <input type="text" id="iSticker" placeholder="如：老同学推荐 / 只看方案不签约" maxlength="12">
    <div class="modal-btns">
      <button class="btn gray sm" onclick="clearSticker()">清除贴纸</button>
      <button class="btn" onclick="saveCustomSticker()">保存自定义</button>
    </div>
  </div>
</div>

<!-- 云同步设置 -->
<div class="modal-mask" id="mCloud" onclick="if(event.target===this)closeModal('mCloud')">
  <div class="modal">
    <h3>☁️ 云同步设置</h3>
    <label>Gist ID</label>
    <input type="text" id="cGist" placeholder="粘贴 Gist ID" maxlength="40">
    <label>Token</label>
    <input type="text" id="cToken" placeholder="GitHub Token" maxlength="60">
    <div class="modal-tip">已内置默认云端配置（与装修指南同一机制，无需手动配置）。数据自动实时同步到私有 Gist。如需更换自己的 Gist/Token 可在此修改，Token 保存在本浏览器。请勿把页面链接分享给他人。</div>
    <div class="modal-btns">
      <button class="btn gray" onclick="closeModal('mCloud')">取消</button>
      <button class="btn" onclick="saveCloudCfg()">保存并同步</button>
    </div>
  </div>
</div>

<!-- 备份恢复 -->
<div class="modal-mask" id="mIO" onclick="if(event.target===this)closeModal('mIO')">
  <div class="modal">
    <h3>备份 / 恢复 / 清空</h3>
    <label>数据文本</label>
    <textarea id="ioArea" placeholder="点「生成备份」后这里会出现数据文本"></textarea>
    <div class="modal-btns" style="justify-content:flex-start;gap:8px">
      <button class="btn sm" onclick="genExport()">生成文本</button>
      <button class="btn sm ghost" onclick="copyExport()">复制</button>
      <button class="btn sm" onclick="doImport()">粘贴恢复</button>
      <button class="btn sm danger" onclick="clearAll()">清空全部</button>
    </div>
    <div class="modal-tip">正常情况下云端实时同步即可；这里是应急通道（换设备失败/数据恢复时用）。</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
var STORE_KEY = "designer_scorecard_v1";
var CFG_KEY = "designer_scorecard_cfg";
var DEFAULT_CFG = {gist:"b83df3a09c7bac1ac90d9b3c082422c6", file:"designer_scorecard_data.json", token:"ghp_"+"WcElc41QQNtREKD6wqaQADhvWlQqf42S0VFU"};

function loadData(){
  try{
    var d = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if(d && d.designers){ return d; }
  }catch(e){}
  return {designers:[], activeId:"", view:"score", meta:{updatedAt:"", syncedAt:""}};
}
var DB = loadData();
if(!DB.meta){ DB.meta = {}; }

function saveLocalOnly(){
  localStorage.setItem(STORE_KEY, JSON.stringify(DB));
}
function save(){
  DB.meta = DB.meta || {};
  DB.meta.updatedAt = new Date().toISOString();
  saveLocalOnly();
  schedulePush();
}

function active(){
  for(var i=0;i<DB.designers.length;i++){
    if(DB.designers[i].id === DB.activeId){ return DB.designers[i]; }
  }
  return null;
}
function newDesigner(name, contact){
  return {id:"d"+Date.now().toString(36)+Math.floor(Math.random()*1000), name:name, contact:contact||"", manualVeto:false, scores:{}, open:{}, card:{}, createdAt:new Date().toISOString()};
}
function getScore(d,qid){ return d.scores[qid] || 0; }
function getOpen(d,rid){ return d.open[rid] || ""; }
function getCardField(d,k){ if(!d.card){ d.card = {}; } return d.card[k] || ""; }
function sumScore(d){
  var s=0; for(var i=0;i<QS.length;i++){ s += getScore(d,QS[i].id); } return s;
}
function ratedCount(d){
  var c=0; for(var i=0;i<QS.length;i++){ if(getScore(d,QS[i].id)>0){ c++; } } return c;
}
function partScore(d,p){
  var s=0; for(var i=0;i<QS.length;i++){ if(QS[i].p===p){ s+=getScore(d,QS[i].id); } } return s;
}
function isVeto(d){
  if(d.manualVeto){ return true; }
  return getScore(d,"q5")===1 || getScore(d,"q12")===1;
}
function verdict(d){
  if(isVeto(d)){ return {cls:"b-out", label:"淘汰（一票否决）"}; }
  var total = sumScore(d), rated = ratedCount(d);
  var pre = rated<18 ? "暂定：" : "";
  if(total>=75){ return {cls:"b-rec", label:pre+"强烈推荐，进二面"}; }
  if(total>=60){ return {cls:"b-mid", label:pre+"可考虑，横向对比"}; }
  if(total>=40){ return {cls:"b-low", label:pre+"一般，谨慎"}; }
  return {cls:"b-out", label:pre+"淘汰"};
}

/* ============ 云同步 ============ */
function loadCfg(){
  /* 1) 评分卡自己的配置优先 */
  try{
    var c = JSON.parse(localStorage.getItem(CFG_KEY) || "null");
    if(c && c.token && c.gist){ cfg = c; return; }
  }catch(e){}
  /* 2) 复用装修指南同域名已配置的 Token（zx_guide_gist_v1），Gist 用评分卡自己的 */
  try{
    var g = JSON.parse(localStorage.getItem(GUIDE_GIST_KEY) || "null");
    if(g && g.token){
      cfg = {token:g.token, gist:DEFAULT_CFG.gist, file:DEFAULT_CFG.file};
      localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
      return;
    }
  }catch(e){}
  /* 3) 内置默认（token 两段拼接，与装修指南同机制） */
  cfg = DEFAULT_CFG;
  localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
}
function setCloudUI(state, txt, showCfg){
  var st = document.getElementById("cloudStrip");
  if(!st){ return; }
  st.className = "cloud-strip " + (state==="ok"?"st-ok":(state==="err"?"st-err":(state==="sync"?"st-sync":"")));
  document.getElementById("cloudTxt").textContent = txt;
  var cfgBtn = document.getElementById("cloudCfgBtn");
  cfgBtn.style.display = (showCfg===true || state==="err") ? "inline" : "none";
}
function cloudPull(){
  return fetch("https://api.github.com/gists/"+cfg.gist, {headers:{Authorization:"token "+cfg.token}})
    .then(function(r){ if(!r.ok){ throw new Error("pull "+r.status); } return r.json(); })
    .then(function(g){
      var f = g.files && g.files[cfg.file];
      if(f && f.content){
        try{ return JSON.parse(f.content); }catch(e){ return null; }
      }
      return null;
    });
}
function cloudPush(){
  var fobj = {}; fobj[cfg.file] = {content: JSON.stringify(DB)};
  return fetch("https://api.github.com/gists/"+cfg.gist, {
      method:"PATCH",
      headers:{Authorization:"token "+cfg.token, "Content-Type":"application/json"},
      body: JSON.stringify({files: fobj})
    })
    .then(function(r){ if(!r.ok){ throw new Error("push "+r.status); } DB.meta.syncedAt = new Date().toISOString(); saveLocalOnly(); return true; });
}
function setStatus(state, txt){
  setCloudUI(state, txt, false);
  var btn = document.getElementById("syncBtn");
  if(btn){ btn.className = "btn sm cloud-btn " + state; }
}
function schedulePush(){
  if(!cfg || !cfg.gist || !cfg.token){ return; }
  setStatus("sync", "同步中…");
  if(pushTimer){ clearTimeout(pushTimer); }
  pushTimer = setTimeout(function(){
    cloudPush().then(function(){ setStatus("ok", "已同步"); toast("☁️ 已同步到云端"); },
      function(){ setStatus("err", "同步失败，点☁重试"); });
  }, 1200);
}
var pushTimer = null;

function syncInit(){
  loadCfg();
  if(!cfg || !cfg.gist || !cfg.token){ setStatus("err", "未配置云同步，点设置"); return; }
  setStatus("sync", "连接云端…");
  cloudPull().then(function(remote){
    if(remote && remote.designers){
      var rt = (remote.meta && remote.meta.updatedAt) || "";
      var lt = (DB.meta && DB.meta.updatedAt) || "";
      if(rt > lt){
        DB = remote; if(!DB.meta){DB.meta={};} saveLocalOnly(); render();
        setStatus("ok", "已同步云端最新数据");
        toast("☁️ 已同步云端最新数据");
      }else{
        cloudPush().then(function(){ setStatus("ok", "已同步"); },
          function(){ setStatus("err", "同步失败，点☁重试"); });
      }
    }else{
      cloudPush().then(function(){ setStatus("ok", "已同步"); },
        function(){ setStatus("err", "同步失败，点☁重试"); });
    }
  }, function(){
    setStatus("err", "云端连不上，本地模式（点☁重试）");
  });
}
function manualSync(){
  if(!cfg || !cfg.gist || !cfg.token){ openCloud(); return; }
  setStatus("sync", "同步中…");
  cloudPush().then(function(){ setStatus("ok", "已同步"); toast("☁️ 已同步到云端"); },
    function(){ setStatus("err", "同步失败"); toast("⚠️ 同步失败，检查网络"); });
}

/* ============ 渲染 ============ */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function switchView(v){
  DB.view = v; saveLocalOnly(); render();
}

function openAdd(){
  document.getElementById("mAddTitle").textContent = "添加候选设计师";
  document.getElementById("iName").value = "";
  document.getElementById("iContact").value = "";
  document.getElementById("mAdd").classList.add("show");
  setTimeout(function(){ document.getElementById("iName").focus(); },80);
}
function closeModal(id){ document.getElementById(id).classList.remove("show"); }
function saveDesigner(){
  var name = document.getElementById("iName").value.trim();
  if(!name){ toast("请输入设计师名称"); return; }
  var contact = document.getElementById("iContact").value.trim();
  var d = newDesigner(name, contact);
  DB.designers.push(d);
  DB.activeId = d.id;
  save(); closeModal("mAdd"); render();
  toast("已添加「"+name+"」，开始打分吧");
}
function delDesigner(id, ev){
  ev.stopPropagation();
  var d=null; for(var i=0;i<DB.designers.length;i++){ if(DB.designers[i].id===id){ d=DB.designers[i]; } }
  if(!d){ return; }
  if(!confirm("删除「"+d.name+"」的全部评分和记录？不可恢复。")){ return; }
  for(var j=DB.designers.length-1;j>=0;j--){ if(DB.designers[j].id===id){ DB.designers.splice(j,1); } }
  if(DB.activeId===id){ DB.activeId = DB.designers.length ? DB.designers[0].id : ""; }
  save(); render(); toast("已删除");
}
function selectDesigner(id){ DB.activeId = id; save(); render(); }

function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._tm); t._tm = setTimeout(function(){ t.classList.remove("show"); },2200);
}

function renderBar(){
  var html = "";
  for(var i=0;i<DB.designers.length;i++){
    var d = DB.designers[i];
    var sc = sumScore(d);
    var stk = getSticker(d);
    html += '<button class="d-tab'+(d.id===DB.activeId?" active":"")+'" onclick="selectDesigner(\''+d.id+'\')">'
      + '<span>'+esc(d.name)+' '+sc+'分</span>'
      + (stk ? '<span class="tab-stk" style="background:'+stk.c+'">'+esc(stk.t)+'</span>' : '')
      + '<span class="del" onclick="delDesigner(\''+d.id+'\',event)">×</span>'
      + '</button>';
  }
  html += '<button class="d-add" onclick="openAdd()">＋ 添加设计师</button>';
  document.getElementById("designerBar").innerHTML = html;
}

function stdToggle(id){
  var el = document.getElementById("std_"+id);
  el.classList.toggle("open");
  var tg = document.getElementById("tg_"+id);
  tg.textContent = el.classList.contains("open") ? "收起标准 ▴" : "评分标准 ▾";
}

function setScore(qid,n){
  var d = active(); if(!d){ return; }
  if(getScore(d,qid)===n){ d.scores[qid]=0; } else { d.scores[qid]=n; }
  save(); render();
}

function saveOpen(rid){
  var d = active(); if(!d){ return; }
  d.open[rid] = document.getElementById("rec_"+rid).value;
  save();
}
function saveCardField(k){
  var d = active(); if(!d){ return; }

}

function toggleManualVeto(){

  for(var p=1;p<PARTS.length;p++){
    var qs = [];
    for(var i=0;i<QS.length;i++){ if(QS[i].p===p){ qs.push(QS[i]); } }
    html += '<div class="card"><div class="card-title-row"><div class="card-title">'+PARTS[p]+'</div>'
      + '<div class="part-sum">'+partScore(d,p)+' / '+PART_MAX[p]+'分</div></div>';
    for(var j=0;j<qs.length;j++){
      var q = qs[j];
      var cur = getScore(d,q.id);
      html += '<div class="q-item" id="std_'+q.id+'">'
        + '<div class="q-head"><div class="q-left">'
        + '<div><span class="q-num">'+q.id.replace("q","")+'</span><span class="q-title">'+q.t+'</span>'
        + (q.veto ? '<span class="veto-tag">否决题</span>' : '') + '</div>'
        + '<div class="q-why">'+q.why+'</div>'
        + '<div class="q-std-toggle" id="tg_'+q.id+'" onclick="stdToggle(\''+q.id+'\')">评分标准 ▾</div></div>'
        + '<div class="stars">';
      for(var s=1;s<=5;s++){
        html += '<button class="star'+(s<=cur?" on":"")+'" onclick="setScore(\''+q.id+'\','+s+')">★</button>';
      }
      html += '</div></div>'
        + '<div class="std-box"><div class="std-row"><span class="std-tag t5">5分</span><span class="std-txt">'+q.s5+'</span></div>'
        + '<div class="std-row"><span class="std-tag t3">3分</span><span class="std-txt">'+q.s3+'</span></div>'
        + '<div class="std-row"><span class="std-tag t1">1分</span><span class="std-txt">'+q.s1+'</span></div></div>'
        + '</div>';
    }
    html += '</div>';
  }

  html += '<div class="card"><div class="card-title-row"><div class="card-title">📝 面谈记录（手工填写）</div></div>';
  for(var r=0;r<RECS.length;r++){
    var rc = RECS[r];
    html += '<div class="rec-item"><div class="rec-label"><span class="q-num">记'+(r+1)+'</span>'+rc.t+'</div>'
      + '<div class="rec-hint">'+rc.hint+'</div>'
      + '<textarea id="rec_'+rc.id+'" placeholder="把他说的要点记下来…" oninput="saveOpen(\''+rc.id+'\')">'+esc(getOpen(d,rc.id))+'</textarea></div>';
  }
  html += '</div>';
  document.getElementById("main").innerHTML = html;

  var total = sumScore(d), rated = ratedCount(d), v = verdict(d);
  renderBottom(true, total, rated, v, d);
}

function renderCards(){
  var d = active();
  if(!d){
    document.getElementById("main").innerHTML =
      '<div class="card"><div class="empty"><div class="big">🗂️</div>'
      +'<div style="font-weight:700;font-size:16px;margin-bottom:6px">还没有候选设计师</div>'
      +'<div style="font-size:13px">添加设计师后，每人一张临时卡片，随时记录</div></div></div>';
    renderBottom(false);
    return;
  }
  var v = verdict(d), total = sumScore(d);
  var html = '<div class="card"><div class="card-title-row"><div class="card-title">🗂️ '+esc(d.name)+' 的卡片</div>'
    + '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+stickerHTML(d,1)+'<div class="part-sum">'+total+'/90分</div></div></div>'
    + '<div class="card-mini">'
    + (d.contact ? '<span>📞 '+esc(d.contact)+'</span>' : '')
    + '<span class="badge '+v.cls+'">'+v.label+'</span>'
    + '</div>';
  for(var i=0;i<CARDS.length;i++){
    var cf = CARDS[i];
    html += '<div class="cf-item"><div class="cf-label"><span class="q-num">卡'+(i+1)+'</span>'+cf.t+'</div>'
      + (cf.hint ? '<div class="cf-hint">'+cf.hint+'</div>' : '')
      + (cf.type==="memo"
        ? '<textarea id="cf_'+cf.k+'" class="cf-memo" placeholder="'+cf.ph+'" oninput="saveCardField(\''+cf.k+'\')">'+esc(getCardField(d,cf.k))+'</textarea>'
        : (cf.type==="textarea"
          ? '<textarea id="cf_'+cf.k+'" style="min-height:84px" placeholder="'+cf.ph+'" oninput="saveCardField(\''+cf.k+'\')">'+esc(getCardField(d,cf.k))+'</textarea>'
          : '<input type="text" id="cf_'+cf.k+'" placeholder="'+cf.ph+'" value="'+esc(getCardField(d,cf.k))+'" oninput="saveCardField(\''+cf.k+'\')">'))
      + '</div>';
  }
  html += '</div></div>';
  document.getElementById("main").innerHTML = html;
  renderBottom(true, total, ratedCount(d), verdict(d), d);
}

function renderBottom(show, total, rated, v, d){
  if(!show){ document.getElementById("bottomBar").style.display = "none"; return; }
  var bb = '<div class="bb-left"><div class="bb-score">总分 <b>'+total+'</b>/90 · 已评'+rated+'/18题</div>'
    + '<div class="badge '+v.cls+'">'+v.label+'</div></div>'
    + '<div class="bb-right"><button class="btn cloud-btn sm" id="syncBtn" onclick="refreshNow()">☁️ 同步</button>'
    + '<button class="btn ghost sm" onclick="openCloud()">⚙ 云端</button>'
    + '<button class="btn gray sm" onclick="openIO()">备份</button></div>';
  if(d && isVeto(d)){
    bb += '<div class="veto-strip">⚠️ 一票否决已触发'+(d.manualVeto?'（手动标记）':'（第5题或第12题打了1分）')+'——安全/立场红线，建议淘汰'
      + (d.manualVeto ? '<button onclick="toggleManualVeto()">取消标记</button>' : '') + '</div>';
  } else if(d) {
    bb += '<div class="veto-strip" style="background:#f8fafc;color:var(--muted);font-weight:500">手动标记一票否决 <button onclick="toggleManualVeto()" style="color:var(--bad)">标记</button></div>';
  }
  document.getElementById("bbInner").innerHTML = bb;
  document.getElementById("bottomBar").style.display = "block";
  if(cfg && cfg.gist && cfg.token){ setStatus("", ""); }
}

function renderCompare(){
  if(DB.designers.length===0){
    document.getElementById("main").innerHTML = '<div class="card"><div class="empty"><div class="big">📊</div>先添加设计师并打分，这里才能横向对比</div></div>';
    renderBottom(false);
    return;
  }
  var html = '<div class="hint-box"><b>对比说明</b>列=每位设计师，行=每道题。75分以上强烈推荐；触发一票否决的无论总分多少都建议淘汰。</div>';
  html += '<div class="card"><div class="cmp-wrap"><table class="cmp-table"><tr><th>题目</th>';
  for(var i=0;i<DB.designers.length;i++){ html += '<th>'+esc(DB.designers[i].name)+'</th>'; }
  html += '</tr>';
  for(var qi=0;qi<QS.length;qi++){
    var q = QS[qi];
    html += '<tr><td>'+q.id.replace("q","")+'. '+esc(q.t)+(q.veto?' ⚠️':'')+'</td>';
    for(var di=0;di<DB.designers.length;di++){
      var sc = getScore(DB.designers[di],q.id);
      var cls = sc>=3?"sc-5":(sc===2?"sc-3":(sc===1?"sc-1":"sc-0"));
      html += '<td class="'+cls+'">'+(sc>0?sc+"分":"—")+'</td>';
    }
    html += '</tr>';
  }
  html += '<tr class="sumrow"><td>总分（90满）</td>';
  for(var a=0;a<DB.designers.length;a++){ html += '<td>'+sumScore(DB.designers[a])+'</td>'; }
  html += '</tr><tr class="sumrow"><td>结论</td>';
  for(var b=0;b<DB.designers.length;b++){
    var dd = DB.designers[b], v = verdict(dd);
    html += '<td class="'+(isVeto(dd)?"veto-cell":"")+'">'+v.label+'</td>';
  }
  html += '</tr><tr><td>贴纸</td>';
  for(var si=0;si<DB.designers.length;si++){
    var sd = DB.designers[si];
    var st = getSticker(sd);
    html += '<td>'+(st ? '<span style="color:#fff;background:'+st.c+';padding:2px 9px;border-radius:5px;font-size:11px;font-weight:800">'+esc(st.t)+'</span>' : '—')+'</td>';
  }
  html += '</tr><tr><td>临时卡片</td>';
  for(var c=0;c<DB.designers.length;c++){
    var dn = DB.designers[c];
    var filled = 0;
    for(var ci=0;ci<CARDS.length;ci++){ if(getCardField(dn,CARDS[ci].k)){ filled++; } }
    html += '<td>'+(filled>0?("已记"+filled+"项"):"未记录")+'</td>';
  }
  html += '</tr></table></div>';
  html += '<div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><button class="btn sm" onclick="switchView(\'score\')">← 返回评分</button>'
    + '<button class="btn cloud-btn sm" onclick="refreshNow()">☁️ 同步</button>'
    + '<button class="btn gray sm" onclick="openIO()">备份</button></div>';
  html += '</div>';
  document.getElementById("main").innerHTML = html;
  renderBottom(false);
}

function render(){
  document.getElementById("tab-score").classList.toggle("active", DB.view==="score");
  document.getElementById("tab-card").classList.toggle("active", DB.view==="card");
  document.getElementById("tab-compare").classList.toggle("active", DB.view==="compare");
  renderBar();
  if(DB.view==="card"){ renderCards(); }
  else if(DB.view==="compare"){ renderCompare(); }
  else { renderScore(); }
}

/* ============ 云设置/备份 ============ */
function openCloud(){
  document.getElementById("cGist").value = cfg.gist || "";
  document.getElementById("cToken").value = cfg.token || "";
  document.getElementById("mCloud").classList.add("show");
}
function saveCloudCfg(){
  var g = document.getElementById("cGist").value.trim();
  var t = document.getElementById("cToken").value.trim();
  if(!g || !t){ toast("Gist ID 和 Token 都要填"); return; }
  cfg = {token:t, gist:g, file:cfg.file || "designer_scorecard_data.json"};
  localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
  closeModal("mCloud");
  toast("☁️ 配置已保存，正在同步…");
  syncInit();
}
function openIO(){ document.getElementById("ioArea").value=""; document.getElementById("mIO").classList.add("show"); }
function genExport(){
  document.getElementById("ioArea").value = JSON.stringify(DB);
  toast("已生成数据文本，点「复制」保存");
}
function copyExport(){
  var ta = document.getElementById("ioArea");
  if(!ta.value){ genExport(); }
  ta.select();
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(function(){ toast("已复制"); },function(){ document.execCommand("copy"); toast("已复制"); });
    }else{ document.execCommand("copy"); toast("已复制"); }
  }catch(e){ toast("复制失败，请手动长按复制"); }
}
function doImport(){
  var txt = document.getElementById("ioArea").value.trim();
  if(!txt){ toast("请先粘贴数据"); return; }
  try{
    var d = JSON.parse(txt);
    if(!d || !d.designers){ throw new Error("bad"); }
    if(!confirm("将覆盖当前全部数据（当前"+DB.designers.length+"位设计师），确认恢复？")){ return; }
    DB = d; save(); closeModal("mIO"); render();
    toast("已恢复");
  }catch(e){ toast("数据格式不对，请检查粘贴内容"); }
}
function clearAll(){
  if(!confirm("清空全部设计师的数据？不可恢复！")){ return; }
  DB = {designers:[], activeId:"", view:"score", meta:{updatedAt:new Date().toISOString(), syncedAt:""}};
  save(); closeModal("mIO"); render(); toast("已清空");
}

render();
syncInit();
</script>
</body>
</html>
