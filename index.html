/* ============ 装修监理指南（合并术语+解决路径+建议） ============ */
var guideExpandState = {};
function toggleGuideStage(stageKey){
  guideExpandState[stageKey] = !guideExpandState[stageKey];
  var el = document.getElementById('guide-stage-'+stageKey);
  if(el) el.classList.toggle('collapsed');
}
/* ---- 交互式步骤：勾选 / 输入 / 确认 / 撤销 ---- */
function toggleGuideCheck(stKey, ci){
  var ck = 'ck_'+stKey+'_'+ci;
  if(!progress['ck_'+stKey]) progress['ck_'+stKey] = {};
  if(progress['ck_'+stKey][ck]) delete progress['ck_'+stKey][ck];
  else progress['ck_'+stKey][ck] = true;
  saveProgress();
  /* 局部更新勾选样式 */
  var li = document.querySelector('#gi-'+stKey+' li[data-ci="'+ci+'"]');
if(li){
    li.classList.toggle('checked');
    var box = li.querySelector('.guide-check-box');
    if(box) box.textContent = progress['ck_'+stKey][ck] ? '✓' : '';
  }
updateGuideTip(stKey);
}
function updateGuideTip(stKey){
  var gs = GUIDE_STEPS;
  /* 从 stKey 解析 stage 与 index */
  var parts = stKey.split('_'); /* guide_stage1_0 */
  var sk = parts[1], sti = parseInt(parts[2],10);
  var step = gs[sk] && gs[sk].steps ? gs[sk].steps[sti] : null;
  if(!step) return;
  var tipEl = document.getElementById('tip-'+stKey);
  if(!tipEl) return;
  var ckObj = progress['ck_'+stKey] || {};
  var allCk = true;
  if(step.checks && step.checks.length){
    for(var i=0;i<step.checks.length;i++){
      if(!ckObj['ck_'+stKey+'_'+i]){ allCk = false; break; }
    }
  }
  var allIn = true;
  if(step.inputs && step.inputs.length){
    var rec = progress['rec_'+stKey] || {};
    for(var j=0;j<step.inputs.length;j++){
      if(!(rec['in_'+stKey+'_'+j])){ allIn = false; break; }
    }
  }
  if(allCk && allIn){
    tipEl.textContent = '全部完成，可以确认了';
    tipEl.classList.remove('incomplete');
  } else {
    var msg = [];
    if(!allCk) msg.push('还有清单未勾选');
    if(!allIn) msg.push('还有记录未填写');
    tipEl.textContent = msg.join('，') + '，确认按钮暂不可用';
    tipEl.classList.add('incomplete');
  }
  var btn = document.querySelector('#gi-'+stKey+' .guide-btn-confirm');
  if(btn) btn.disabled = !(allCk && allIn);
}
function saveGuideInput(stKey, ii){
  var inKey = 'in_'+stKey+'_'+ii;
  var el = document.getElementById(inKey);
  if(!el) return;
  var val = el.value.trim();
  if(!progress['rec_'+stKey]) progress['rec_'+stKey] = {};
  if(val) progress['rec_'+stKey][inKey] = val;
  else delete progress['rec_'+stKey][inKey];
  saveProgress();
  var savedEl = document.getElementById('saved-'+inKey);
  if(savedEl) savedEl.classList.toggle('hidden', !val);
  updateGuideTip(stKey);
}
function confirmGuideStep(stKey){
  var gs = GUIDE_STEPS;
  var parts = stKey.split('_'); /* guide_stage1_0 */
  var sk = parts[1], sti = parseInt(parts[2],10);
  var step = gs[sk] && gs[sk].steps ? gs[sk].steps[sti] : null;
  if(!step) return;
  /* 校验清单全勾选 */
  var ckObj = progress['ck_'+stKey] || {};
  var allCk = true;
  if(step.checks && step.checks.length){
    for(var i=0;i<step.checks.length;i++){ if(!ckObj['ck_'+stKey+'_'+i]){ allCk = false; break; } }
  }
  var rec = progress['rec_'+stKey] || {};
  var allIn = true;
  if(step.inputs && step.inputs.length){
    for(var j=0;j<step.inputs.length;j++){ if(!rec['in_'+stKey+'_'+j]){ allIn = false; break; } }
  }
  if(!allCk || !allIn){
    var tipEl = document.getElementById('tip-'+stKey);
    if(tipEl) tipEl.textContent = '请先勾选全部清单并填写全部记录';
    alert('请先勾选全部清单并填写全部记录后再确认完成');
    return;
  }
  progress[stKey] = true;
  saveProgress();
  renderContent();
}
function undoGuideStep(stKey){
  delete progress[stKey];
  saveProgress();
  renderContent();
}
function renderGuide(area){
  var stageOrder = ['stage1','stage1.5','stage2','stage3','stage4','stage5','stage6','stage7','stage8'];
  var stageIcons = {'stage1':'📋','stage1.5':'📐','stage2':'🔨','stage3':'⚡','stage4':'🧱','stage5':'🪵','stage6':'🎨','stage7':'🔧','stage8':'🛋️'};
  var html = '';
  html += '<div class="bento-card">';
  html += '<div class="card-title"><span class="card-icon">📋</span>装修监理指南<span class="card-subtitle">从准备到软装 · 攻略式逐步引导 · 共9个阶段</span></div>';
  html += '<div class="tip-box tip-info"><span class="tip-ic">💡</span><div>本指南像游戏攻略一样，按施工顺序一步步引导你完成每个阶段。每个步骤都包含<b>做什么、勾选确认清单、填写记录、术语解释、常见坑、验收标准、补救措施</b>。勾选+填写后点击「确认完成」才算完成该步骤。点击阶段标题可折叠/展开。</div></div>';

  for(var si=0; si<stageOrder.length; si++){
    var sk = stageOrder[si];
    var sd = STAGE_DETAILS[sk];
    var gs = GUIDE_STEPS[sk];
    var icon = stageIcons[sk] || '📌';

    html += '<div class="guide-stage collapsed" id="guide-stage-'+sk+'">';
    /* 阶段标题 */
    html += '<div class="guide-stage-head" onclick="toggleGuideStage(\''+sk+'\')">';
    html += '<div class="guide-stage-num">'+(si+1)+'</div>';
    html += '<div class="guide-stage-title">'+icon+' '+sd.name+'</div>';
    html += '<div class="guide-stage-toggle">▼</div>';
    html += '</div>';
    html += '<div class="guide-stage-body">';

    /* 阶段简介 */
    if(gs && gs.intro){
      html += '<div class="guide-stage-intro">'+gs.intro+'</div>';
    }

    /* 攻略步骤 */
    if(gs && gs.steps){
      for(var sti=0; sti<gs.steps.length; sti++){
        var step = gs.steps[sti];
        var stKey = 'guide_' + sk + '_' + sti;
        var stDone = !!progress[stKey];
        var stRec = progress['rec_' + stKey] || {};
        var stChecks = progress['ck_' + stKey] || {};

        html += '<div class="guide-step'+(stDone?' guide-step-done':'')+'">';
        html += '<div class="guide-step-num">'+(sti+1)+'</div>';
        html += '<div class="guide-step-body">';
        html += '<div class="guide-step-title">'+step.title;
        if(stDone) html += '<span class="guide-step-badge done">✅ 已完成</span>';
        else html += '<span class="guide-step-badge todo">⏳ 待完成</span>';
        html += '</div>';
        html += '<div class="guide-step-desc">'+step.desc+'</div>';

        /* 内联标注：术语/坑 双列 + 验收/补救 双列 */
        var hasTerm = step.term && step.term.length>0;
        var hasWarn = step.warn && step.warn.length>0;
        var hasPass = step.pass && step.pass.length>0;
        var hasFix = step.fix && step.fix.length>0;

        if(hasTerm || hasWarn){
          html += '<div class="guide-inline">';
          if(hasTerm) html += '<div class="guide-inline-item guide-inline-term"><b>📖 术语</b><br>'+step.term+'</div>';
          if(hasWarn) html += '<div class="guide-inline-item guide-inline-warn"><b>⚠️ 常见坑</b><br>'+step.warn+'</div>';
          html += '</div>';
        }

        /* 交互区：勾选清单 + 输入框 + 确认按钮 */
        html += '<div class="guide-interactive" id="gi-'+stKey+'">';
        var hasChecks = step.checks && step.checks.length>0;
        var hasInputs = step.inputs && step.inputs.length>0;
        /* 计算是否全部完成（用于初始按钮状态） */
        var allCkInit = true;
        if(hasChecks){
          for(var cii=0; cii<step.checks.length; cii++){
            if(!stChecks['ck_'+stKey+'_'+cii]){ allCkInit = false; break; }
          }
        }
        var allInInit = true;
        if(hasInputs){
          for(var iii=0; iii<step.inputs.length; iii++){
            if(!stRec['in_'+stKey+'_'+iii]){ allInInit = false; break; }
          }
        }
        var canConfirm = allCkInit && allInInit;
        if(hasChecks){
          html += '<div class="guide-sec-label">📋 检查清单（逐项勾选）</div>';
          html += '<ul class="guide-check-list">';
          for(var ci=0; ci<step.checks.length; ci++){
            var ck = 'ck_'+stKey+'_'+ci;
            var cDone = !!stChecks[ck];
            html += '<li class="'+(cDone?'checked':'')+'" data-ci="'+ci+'" onclick="toggleGuideCheck(\''+stKey+'\',\''+ci+'\')"><span class="guide-check-box">'+(cDone?'✓':'')+'</span><span>'+step.checks[ci]+'</span></li>';
          }
          html += '</ul>';
        }
        if(hasInputs){
          html += '<div class="guide-sec-label">✏️ 记录填写</div>';
          for(var ii=0; ii<step.inputs.length; ii++){
            var inp = step.inputs[ii];
            var inKey = 'in_'+stKey+'_'+ii;
            var savedVal = stRec[inKey] || '';
            html += '<div class="guide-input-row"><span class="guide-input-label">'+inp.label+'</span><input type="text" id="'+inKey+'" value="'+esc(savedVal)+'" placeholder="'+(inp.ph||'')+'" onblur="saveGuideInput(\''+stKey+'\',\''+ii+'\')"><span class="guide-input-saved'+(savedVal?'':' hidden')+'" id="saved-'+inKey+'">✓ 已存</span></div>';
          }
        }
        html += '<div class="guide-confirm-row">';
        if(stDone){
          html += '<button class="guide-btn guide-btn-undo" onclick="undoGuideStep(\''+stKey+'\')">↩ 撤销确认</button>';
          html += '<span class="guide-confirm-tip">该步骤已确认完成</span>';
        } else {
          html += '<button class="guide-btn guide-btn-confirm" onclick="confirmGuideStep(\''+stKey+'\')"'+(canConfirm?'':' disabled')+'>✅ 确认完成</button>';
          var initTipMsg = canConfirm ? '全部完成，可以确认了' : (hasChecks && !allCkInit ? '还有清单未勾选' : '') + ((hasChecks && !allCkInit) && (hasInputs && !allInInit) ? '，' : '') + (hasInputs && !allInInit ? '还有记录未填写' : '') + (canConfirm?'':'，确认按钮暂不可用');
          html += '<span class="guide-confirm-tip'+(canConfirm?'':' incomplete')+'" id="tip-'+stKey+'">'+initTipMsg+'</span>';
        }
        html += '</div>';
        html += '</div>'; /* guide-interactive */

        if(hasPass || hasFix){
          html += '<div class="guide-inline">';
          if(hasPass) html += '<div class="guide-inline-item guide-inline-pass"><b>✅ 验收标准</b><br>'+step.pass+'</div>';
          if(hasFix) html += '<div class="guide-inline-item guide-inline-fix"><b>🔧 补救措施</b><br>'+step.fix+'</div>';
          html += '</div>';
        }

        html += '</div>'; /* guide-step-body */
        html += '</div>'; /* guide-step */
      }
    }

    /* 阶段贴士 */
    if(gs && gs.tip){
      html += '<div class="guide-stage-tip"><div class="tip-box tip-warn"><span class="tip-ic">⚠️</span><div>'+gs.tip+'</div></div></div>';
    }

    html += '</div>'; /* guide-stage-body */
    html += '</div>'; /* guide-stage */
  }

  html += '</div>';
  area.innerHTML = html;
}

function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ============ 交互逻辑 ============ */
function toggleCheck(id, event){
  /* 点击「✎ 记采购」区域 → 展开/收起采购记录 */
  if(event){
    var target = event.target;
    if(target.classList && target.classList.contains('check-expand')){
      event.stopPropagation();
      var inline = document.getElementById('rec-inline-'+id);
      if(inline){
        inline.classList.toggle('show');
        var item = inline.previousElementSibling;
        if(item) item.classList.toggle('expanded');
      }
return;
    }
  }
  /* 正常勾选 */
  if(progress[id]) delete progress[id];
  else progress[id] = true;
  saveProgress();
  renderContent();
  /* 勾选完成时，自动展开采购填报（可选，跳过即可） */
  if(progress[id]){
    var inline2 = document.getElementById('rec-inline-'+id);
    if(inline2){ inline2.classList.add('show'); var it2 = inline2.previousElementSibling; if(it2) it2.classList.add('expanded'); }
  }
}

function saveRecInline(taskId){
  var name = document.getElementById('ri-name-'+taskId).value.trim();
  if(!name){ alert('请填写物品名称'); return; }
  var model = document.getElementById('ri-model-'+taskId).value.trim();
  var place = document.getElementById('ri-place-'+taskId).value.trim();
  var price = parseFloat(document.getElementById('ri-price-'+taskId).value)||0;
  var qty = parseInt(document.getElementById('ri-qty-'+taskId).value)||1;
  var note = document.getElementById('ri-note-'+taskId).value.trim();
  var total = Math.round(price*qty*100)/100;
  progress['rec_'+taskId] = {name:name, model:model, place:place, price:price, qty:qty, note:note, total:total};
  saveProgress();
  renderContent();
}

function saveNoteInline(taskId){
  var input = document.getElementById('rn-note-'+taskId);
  if(!input) return;
  var val = input.value.trim();
  if(!val){ alert('请填写记录内容'); return; }
  progress['rec_'+taskId] = {name:val};
  saveProgress();
  renderContent();
}

function clearRecInline(taskId){
  if(!progress['rec_'+taskId]) return;
  if(!confirm('确定清除这条采购记录？')) return;
  delete progress['rec_'+taskId];
  saveProgress();
  renderContent();
}

      if(!stageMap[r.stage]) stageMap[r.stage] = 0;
      stageMap[r.stage] += r.total||0;
    }
    var maxVal = 0;
    for(var k in stageMap){ if(stageMap[k]>maxVal) maxVal=stageMap[k]; }
    html += '<div class="bento-card">';
    html += '<div class="card-title"><span class="card-icon">📊</span>各阶段采购支出<span class="card-subtitle">按阶段汇总</span></div>';
    html += '<div style="display:flex;flex-direction:column;gap:12px;padding:4px 0;">';
    for(var k in stageMap){
      var pct = maxVal>0 ? Math.round(stageMap[k]/maxVal*100) : 0;
      var barColor = pct>66 ? 'linear-gradient(90deg,#ef4444,#dc2626)' : pct>33 ? 'linear-gradient(90deg,#f59e0b,#d97706)' : 'linear-gradient(90deg,#6366f1,#764ba2)';
      html += '<div>';
      html += '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;"><span style="font-weight:600;">'+k+'</span><span style="color:var(--accent);font-weight:700;">¥'+stageMap[k].toLocaleString()+'</span></div>';
      html += '<div style="height:10px;background:#f1f5f9;border-radius:5px;overflow:hidden;"><div style="height:100%;width:'+pct+'%;background:'+barColor+';border-radius:5px;transition:width .4s ease;"></div></div>';
      html += '</div>';
    }
    html += '</div></div>';
  }
  /* 决策记录列表 */
  var noteRecords = records.filter(function(r){return !r.isPurchase;});
  if(noteRecords.length>0){
    html += '<div class="bento-card">';
    html += '<div class="card-title"><span class="card-icon">📝</span>决策记录<span class="card-subtitle">各阶段记录的决策内容</span></div>';
    for(var i=0;i<noteRecords.length;i++){
      var r = noteRecords[i];
      html += '<div style="display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #f1f5f9;">';
      html += '<div style="font-size:20px;flex-shrink:0;">📝</div>';
      html += '<div style="flex:1;">';
      html += '<div style="font-weight:700;font-size:14px;">'+esc(r.name)+'</div>';
      html += '<div style="font-size:12px;color:var(--text-muted);margin-top:2px;">'+r.stage+' · '+r.label+'</div>';
      html += '</div></div>';
    }
    html += '</div>';
  }
  area.innerHTML = html;
}

/* 上传户型图 */

/* 上传效果图 */

  var file = input.files[0];

  uploadFpToRepo(file, function(url, err){

/* 通用上传到 GitHub */
function uploadFpToRepo(file, cb){
  var cfg = getGistCfg();
  if(!cfg || !cfg.token){ cb(null,'未配置云同步 Token'); return; }
  var reader = new FileReader();
  reader.onload = function(e){
    var b64 = e.target.result.split(',')[1];
    var ext = (file.name.split('.').pop()||'jpg').toLowerCase();
    if(ext==='jpeg') ext='jpg';
    var path = 'img/'+Date.now()+'_'+file.name.replace(/[^\w.\u4e00-\u9fa5-]/g,'_');
    var repo = 'ZK02727/renovation-guide';
    fetch('https://api.github.com/repos/'+repo+'/contents/'+encodeURIComponent(path), {
      method:'PUT',
      headers:{'Authorization':'Bearer '+cfg.token,'Content-Type':'application/json'},
      body: JSON.stringify({message:'upload image', content:b64})
    }).then(function(r){
      if(!r.ok) return r.json().then(function(j){ throw new Error(j.message||'上传失败'); });
      return r.json();
    }).then(function(j){
      var url = 'https://cdn.jsdelivr.net/gh/ZK02727/renovation-guide@main/'+path;
      cb(url, null);
    }).catch(function(err){ cb(null, err.message||'网络错误'); });
  };
  reader.readAsDataURL(file);
}

/* SVG 编辑交互 */
var fpDraw = {wallStart:null, svgWidth:800, svgHeight:560};
function fpSvgPos(evt){
  var svg = document.getElementById('fp-svg');
  if(!svg) return {x:0,y:0};
  var rect = svg.getBoundingClientRect();
  var x = (evt.clientX - rect.left) / rect.width * 800;
  var y = (evt.clientY - rect.top) / rect.height * 560;
  return {x:Math.round(x), y:Math.round(y)};
}
function fpSvgDown(evt){
  if(fpState.mode==='wall' || fpState.mode==='delwall'){
    var p = fpSvgPos(evt);
    fpDraw = {start:p, line:null, type: fpState.mode==='delwall'?'del':'new'};
    var svg = document.getElementById('fp-svg');
    fpDraw.line = document.createElementNS('http://www.w3.org/2000/svg','line');
    fpDraw.line.setAttribute('x1',p.x); fpDraw.line.setAttribute('y1',p.y);
    fpDraw.line.setAttribute('x2',p.x); fpDraw.line.setAttribute('y2',p.y);
    fpDraw.line.setAttribute('stroke', fpState.mode==='delwall'?'#ef4444':'#3b82f6');
    fpDraw.line.setAttribute('stroke-width','4');
    fpDraw.line.setAttribute('stroke-dasharray', fpState.mode==='delwall'?'9 5':'7 4');
    svg.appendChild(fpDraw.line);
  }
}
function fpSvgMove(evt){
  if(!fpDraw || !fpDraw.line) return;
  var p = fpSvgPos(evt);
  fpDraw.line.setAttribute('x2',p.x); fpDraw.line.setAttribute('y2',p.y);
}
function fpSvgUp(evt){
  if(!fpDraw) return;
  var p = fpSvgPos(evt);
  var len = Math.sqrt(Math.pow(p.x-fpDraw.start.x,2)+Math.pow(p.y-fpDraw.start.y,2));
  if(len>8){
    var plan = progress['fp_plan'] || (progress['fp_plan']={walls:[],markers:[]});
    if(!plan.walls) plan.walls=[];
    plan.walls.push({id:'w_'+Date.now()+'_'+Math.floor(Math.random()*999), x1:fpDraw.start.x, y1:fpDraw.start.y, x2:p.x, y2:p.y, type:fpDraw.type==='del'?'del':'new'});
    fpDraw.line.setAttribute('class', fpDraw.type==='del'?'fp-wall-del':'fp-wall-new');
  } else {
    if(fpDraw.line) fpDraw.line.remove();
  }
  fpDraw = null;
}
function fpSvgClick(evt){
  if(fpState.mode==='marker'){
    var p = fpSvgPos(evt);
    var plan = progress['fp_plan'] || (progress['fp_plan']={walls:[],markers:[],rooms:[]});
    if(!plan.markers) plan.markers=[];
    var mid = 'm'+Date.now();
    plan.markers.push({id:mid, x:p.x, y:p.y, effId:null, room:''});
    saveProgress();
    renderFloorplan();
    /* 创建后直接弹出关联效果图选择 */
    fpLinkEffToMarker(mid);
  }
}

    '<div class="fp-field"><label>名称（可选）</label><input class="fp-input" id="fp-edit-name" value="'+esc(e.name||'')+'" placeholder="如：客厅奶油风"></div>'+
    '<div class="fp-field"><label>备注</label><textarea class="fp-input" id="fp-edit-note" rows="3" placeholder="写下这张图的灵感、品牌、预算参考…">'+esc(e.note||'')+'</textarea></div>'+
    '<div class="fp-field"><label>关联区域</label><select class="fp-input" id="fp-edit-room">'+roomOpts+'</select></div>'+
    '<div style="font-size:11px;color:var(--text-muted);">关联到户型图：在户型图中切换到「📍 标效果图」模式，点击图上位置即可关联。</div>'+
    '<div class="fp-modal-actions">'+
    '<button class="btn btn-ghost" onclick="document.getElementById(\'fp-edit-mask\').remove()">取消</button>'+
    '<button class="btn" onclick="fpSaveEff(\''+id+'\')">💾 保存</button>'+
    '</div></div>';
  mask.addEventListener('click', function(ev){ if(ev.target===mask) mask.remove(); });
  document.body.appendChild(mask);
}
function fpSaveEff(id){
  var effs = progress['fp_effs']||[];
  var e = null;
  for(var i=0;i<effs.length;i++){ if(effs[i].id===id) e=effs[i]; }
  if(!e) return;
  e.name = document.getElementById('fp-edit-name').value.trim();
  e.note = document.getElementById('fp-edit-note').value.trim();
  e.roomId = document.getElementById('fp-edit-room').value;
  /* 映射 roomId -> room 名 */
  var rooms = (progress['fp_plan']&&progress['fp_plan'].rooms)||[];
  for(var j=0;j<rooms.length;j++){ if(rooms[j].id===e.roomId) e.room = rooms[j].name; }
  saveProgress();
  var mask = document.getElementById('fp-edit-mask');
  if(mask) mask.remove();
  renderFloorplan();
}
function fpDelEff(id){
  if(!confirm('确定删除这张效果图？')) return;
  progress['fp_effs'] = (progress['fp_effs']||[]).filter(function(e){ return e.id!==id; });
  saveProgress();
  renderFloorplan();
}

/* 关联效果图到户型图：点击户型图某处时弹出选择 */
function fpLinkEffToMarker(markerId){
  var plan = progress['fp_plan']||{};
  var markers = plan.markers||[];
  var effs = progress['fp_effs']||[];
  var mk = null;
  for(var i=0;i<markers.length;i++){ if(markers[i].id===markerId) mk=markers[i]; }
  if(!mk) return;
  var opts = '<option value="">— 不关联 —</option>';
  for(var j=0;j<effs.length;j++){ opts += '<option value="'+esc(effs[j].id)+'"'+(mk.effId===effs[j].id?' selected':'')+'>'+esc(effs[j].name||('效果图 '+(j+1)))+'</option>'; }
  var mask = document.createElement('div');
  mask.className='fp-modal-mask';
  mask.innerHTML = '<div class="fp-modal">'+
    '<h4>📍 关联效果图</h4>'+
    '<div class="fp-field"><label>选择要关联的效果图</label><select class="fp-input" id="fp-link-select">'+opts+'</select></div>'+
    '<div class="fp-modal-actions">'+
    '<button class="btn btn-ghost" onclick="this.closest(\'.fp-modal-mask\').remove()">取消</button>'+
    '<button class="btn" onclick="fpLinkSave(\''+markerId+'\')">关联</button>'+
    '</div></div>';
  document.body.appendChild(mask);
}
function fpLinkSave(markerId){
  var plan = progress['fp_plan']||{};
  var markers = plan.markers||[];
  var sel = document.getElementById('fp-link-select').value;
  var mk = null;
  for(var i=0;i<markers.length;i++){ if(markers[i].id===markerId) mk=markers[i]; }
  if(!mk) return;
  mk.effId = sel || null;
  /* 反写效果图的 linkedTo */
  var effs = progress['fp_effs']||[];
  for(var j=0;j<effs.length;j++){ effs[j].linkedTo = (effs[j].linkedTo && effs[j].linkedTo===markerId) ? (sel?markerId:null) : (effs[j].id===sel?markerId:(effs[j].linkedTo||null)); }
  saveProgress();
  var mask = document.querySelector('.fp-modal-mask');
  if(mask) mask.remove();
  renderFloorplan();
}

function renderStats(){
  var el = document.getElementById('main-stats');
  var st = getAllStats();
  var cur = getCurrentStage();
  el.innerHTML = '<span>整体进度 <span>'+st.pct+'%</span></span><span>已完成 <span style="color:#22c55e">'+st.done+'</span> 项</span><span>当前阶段 <span style="color:#f59e0b">'+(cur?cur.name:'全部完成')+'</span></span>';
}

function updateBadges(){
  var ids = ['stage1','stage1.5','stage2','stage3','stage4','stage5','stage6','stage7','stage8'];
  for(var i=0;i<ids.length;i++){
    var id = ids[i];
    var el = document.getElementById('badge-'+id);
    if(!el) continue;
    var pct = getStagePct(id);
    if(pct===100){ el.textContent = '✔'; el.style.display=''; el.style.background='#22c55e'; }
    else if(pct>0){ el.textContent = pct+'%'; el.style.display=''; el.style.background='#f59e0b'; }
    else { el.style.display='none'; }
  }
}

/* 导出 / 导入 / 重置 */
function exportData(){
  var blob = new Blob([JSON.stringify(progress, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '装修进度与采购_'+getTodayStr()+'.json';
  a.click();
  URL.revokeObjectURL(a.href);
}
function importData(){
  document.getElementById('import-file').click();
}
function handleImport(event){
  var file = event.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var data = JSON.parse(e.target.result);
      if(data && typeof data === 'object') progress = data.progress || data;
      saveProgress();
      renderContent();
      alert('导入成功！');
    }catch(err){
      alert('导入失败：文件格式不正确');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}
function resetAll(){
  if(!confirm('确定要清空所有进度吗？此操作不可恢复，建议先导出备份。')) return;
  progress = {};
  saveProgress();
  renderContent();
}

/* 日期 */
function getTodayStr(){
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function initSidebarDate(){
  var el = document.getElementById('sidebar-date');
  var d = new Date();
  var week = ['日','一','二','三','四','五','六'][d.getDay()];
  el.textContent = d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 周'+week;
}

/* 初始化 */
initSidebarDate();
/* 登录后才会渲染主界面（登录逻辑在 hideLogin 中调用 renderContent） */
if(getSession()){
  renderContent();
  initCloudSync();
}
document.getElementById('login-pass').addEventListener('keydown', function(e){
  if(e.key==='Enter') doLogin();
});
</script>
